[package]
name = "speckle"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
arrow = "59.1.0"
arrow-array = "59.1.0"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.2", features = ["derive"] }
csv = "1.4.0"
image = "0.25.10"
parquet = { version = "59.1.0", features = ["arrow"] }
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = "1.0.228"
softbuffer = { git = "https://github.com/rust-windowing/softbuffer", rev = "840683c" }
tch = "0.23.0"
thiserror = "2.0.18"
toml = "1.1.3"
winit = "0.30.13"
